<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="422" viewBox="0 0 1120 422" role="img" aria-labelledby="title desc">
<title id="title">Agent、Gateway 与上游服务的关系</title><desc id="desc">Agent 执行任务；Gateway 管理身份授权、连接和审计；上游提供模型、工具、知识与存储。</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#9baec7"/></marker></defs>
<rect width="1120" height="422" rx="20" fill="#f3f6fb"/>
<g font-family="'Noto Sans SC','PingFang SC','Microsoft YaHei',sans-serif"><text x="34" y="48" font-size="28" fill="#17243b" font-weight="700">执行任务与管理接入，各在对应入口完成</text><text x="34" y="80" font-size="18" fill="#556680" font-weight="400">Gateway 可以服务 ClaweeAgent，也可以服务其他支持相应接口的 Agent。</text><rect x="34" y="120" width="276" height="214" rx="16" fill="#ffffff" stroke="#dbe3ef"/><text x="55" y="158" font-size="19" fill="#17243b" font-weight="700">ClaweeAgent / 其他 Agent</text><text x="55" y="204" font-size="18" fill="#556680" font-weight="400">接收用户任务</text><text x="55" y="241" font-size="18" fill="#556680" font-weight="400">读取与修改工作目录文件</text><text x="55" y="278" font-size="18" fill="#556680" font-weight="400">调用获准的模型和工具</text><path d="M314 226 L359 226" stroke="#9baec7" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/><rect x="367" y="120" width="326" height="214" rx="16" fill="#eaf1ff" stroke="#bfd0ee"/><text x="389" y="159" font-size="25" fill="#2e5896" font-weight="700">AI Gateway</text><text x="389" y="204" font-size="18" fill="#405979" font-weight="400">账号、角色、授权与门禁</text><text x="389" y="241" font-size="18" fill="#405979" font-weight="400">模型 / MCP 连接、路由与审计</text><text x="389" y="278" font-size="18" fill="#405979" font-weight="400">Skill、知识库与共享资源</text><rect x="777" y="111" width="309" height="76" rx="16" fill="#ffffff" stroke="#dbe3ef"/><text x="797" y="142" font-size="21" fill="#17243b" font-weight="700">模型服务</text><text x="797" y="169" font-size="17" fill="#556680" font-weight="400">提供模型能力</text><path d="M699 226 L769 149" stroke="#9baec7" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/><rect x="777" y="201" width="309" height="76" rx="16" fill="#ffffff" stroke="#dbe3ef"/><text x="797" y="232" font-size="21" fill="#17243b" font-weight="700">MCP 工具</text><text x="797" y="259" font-size="17" fill="#556680" font-weight="400">查询或操作外部系统</text><path d="M699 226 L769 239" stroke="#9baec7" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/><rect x="777" y="291" width="309" height="76" rx="16" fill="#ffffff" stroke="#dbe3ef"/><text x="797" y="322" font-size="21" fill="#17243b" font-weight="700">知识库与文件存储</text><text x="797" y="349" font-size="17" fill="#556680" font-weight="400">提供团队资料</text><path d="M699 226 L769 329" stroke="#9baec7" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/><text x="34" y="392" font-size="19" fill="#3766a8" font-weight="400">成员：在 Agent 中做任务。管理员：在 Gateway 中准备连接、资源和权限。</text></g></svg>