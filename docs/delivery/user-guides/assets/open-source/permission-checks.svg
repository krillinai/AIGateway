<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="454" viewBox="0 0 1120 454" role="img" aria-labelledby="title desc">
<title id="title">权限排查的四项检查</title><desc id="desc">分别检查后台角色、具体资源与操作权限、Agent 工具授权以及调用门禁和有效期。</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#9baec7"/></marker></defs>
<rect width="1120" height="454" rx="20" fill="#f3f6fb"/>
<g font-family="'Noto Sans SC','PingFang SC','Microsoft YaHei',sans-serif"><text x="34" y="48" font-size="29" fill="#17243b" font-weight="700">看得见页面，不代表能访问所有资源</text><text x="34" y="80" font-size="18" fill="#556680" font-weight="400">按目标操作分别核对以下项目；不同资源和调用使用各自的授权规则。</text><rect x="34" y="105" width="520" height="133" rx="16" fill="#ffffff" stroke="#dbe3ef"/><text x="54" y="138" font-size="17" fill="#3766a8" font-weight="700">01</text><text x="94" y="139" font-size="23" fill="#17243b" font-weight="700">后台角色</text><text x="54" y="178" font-size="18" fill="#556680" font-weight="400">能否进入后台页面、看到操作按钮？</text><text x="54" y="210" font-size="18" fill="#556680" font-weight="400">例：能查看技能，但未必能发布。</text><rect x="579" y="105" width="520" height="133" rx="16" fill="#ffffff" stroke="#dbe3ef"/><text x="599" y="138" font-size="17" fill="#3766a8" font-weight="700">02</text><text x="639" y="139" font-size="23" fill="#17243b" font-weight="700">资源与 Action</text><text x="599" y="178" font-size="18" fill="#556680" font-weight="400">能否访问这一个空间、知识库或视图？</text><text x="599" y="210" font-size="18" fill="#556680" font-weight="400">例：允许下载，不代表允许替换。</text><rect x="34" y="260" width="520" height="133" rx="16" fill="#ffffff" stroke="#dbe3ef"/><text x="54" y="293" font-size="17" fill="#3766a8" font-weight="700">03</text><text x="94" y="294" font-size="23" fill="#17243b" font-weight="700">Agent 的 Tool 授权</text><text x="54" y="333" font-size="18" fill="#556680" font-weight="400">目标 Agent 是否获准调用这个工具？</text><text x="54" y="365" font-size="18" fill="#556680" font-weight="400">例：连接器已开启，仍可能未授权。</text><rect x="579" y="260" width="520" height="133" rx="16" fill="#ffffff" stroke="#dbe3ef"/><text x="599" y="293" font-size="17" fill="#3766a8" font-weight="700">04</text><text x="639" y="294" font-size="23" fill="#17243b" font-weight="700">调用门禁与有效期</text><text x="599" y="333" font-size="18" fill="#556680" font-weight="400">这次调用是否还需确认或审批？</text><text x="599" y="365" font-size="18" fill="#556680" font-weight="400">例：有授权，仍需核对实际参数。</text><text x="34" y="428" font-size="18" fill="#3766a8" font-weight="400">验证方法：用目标普通账号和 Agent 做一次最小操作，再检查真实结果与审计。</text></g></svg>